services:
  - type: web
    name: transport-system
    runtime: node
    # free tier spins down after 15 min idle → 30-60s cold start on the next
    # visit; move to "starter" the moment real users depend on this
    plan: free
    # MUST match the database's region — the app runs many queries per page,
    # so cross-region round-trips multiply into seconds of latency. Create the
    # Supabase project in ap-southeast-1 (Singapore) to sit next to this.
    region: singapore
    # build regenerates the Prisma client; start applies migrations (works even
    # if the dashboard overrides this command with a plain npm build)
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      # Supabase (Singapore project): see .env.example for the exact string
      # shapes — DATABASE_URL is the "Transaction" pooler (port 6543, with
      # ?pgbouncer=true), DIRECT_DATABASE_URL the direct 5432 connection that
      # prisma migrate needs
      - key: DATABASE_URL
        sync: false # paste the Supabase pooled (6543) connection string in the dashboard
      - key: DIRECT_DATABASE_URL
        sync: false # paste the Supabase direct (5432) connection string
      - key: AUTH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads # NOTE: free tier has no persistent disk — uploads are lost on redeploy
      - key: NEXT_PUBLIC_APP_NAME
        value: TransportTMS
