services:
  - type: web
    name: transport-system
    runtime: node
    # starter keeps the instance warm: no 15-min spin-down, so no 30-60s cold
    # start and — just as important — the in-process unstable_cache behind the
    # master-data lookups and the outstanding tile survives between requests
    # instead of being wiped on every idle
    plan: starter
    # MUST match the database's region — the app runs many queries per page,
    # so cross-region round-trips multiply into seconds of latency. Create the
    # Supabase project in ap-southeast-1 (Singapore) to sit next to this.
    region: singapore
    # build regenerates the Prisma client; start applies migrations (works even
    # if the dashboard overrides this command with a plain npm build)
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    # uploads must NOT sit on the ephemeral filesystem — /tmp is wiped on every
    # redeploy and restart, silently losing POD scans and bill attachments
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      # Supabase (Singapore project): see .env.example for the exact string
      # shapes — DATABASE_URL is the "Transaction" pooler (port 6543, with
      # ?pgbouncer=true), DIRECT_DATABASE_URL the direct 5432 connection that
      # prisma migrate needs
      - key: DATABASE_URL
        sync: false # paste the Supabase pooled (6543) connection string in the dashboard
      - key: DIRECT_DATABASE_URL
        sync: false # paste the Supabase direct (5432) connection string
      - key: AUTH_SECRET
        generateValue: true
      # persistent disk above; object storage (Supabase Storage / S3) is the
      # longer-term option and is its own change, with its own parity test
      # against the four routes in src/app/api/uploads/**
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: NEXT_PUBLIC_APP_NAME
        value: TransportTMS
